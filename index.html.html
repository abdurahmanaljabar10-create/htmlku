<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Pertamaku</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f4f8;
      color: #222;
      text-align: center;
      padding: 50px 20px;
    }
    .kartu {
      max-width: 500px;
      margin: auto;
      padding: 30px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 12px #00000018;
    }
    h1 { color: #1769aa; }
    button {
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      background: #1769aa;
      color: white;
      cursor: pointer;
    }
    button:hover { background: #0d4777; }
  </style>
</head>
<body>
  <div class="kartu">
    <h1>Halo, Dunia!</h1>
    <p>Selamat datang di website HTML pertamaku.</p>
    <button onclick="alert('Halo! Tombol berhasil diklik.')">Klik Saya</button>
  </div>
</body>
</html>
